<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Placeholder portrait silhouette">
  <title>Placeholder portrait silhouette</title>
  <defs>
    <!-- userSpaceOnUse keeps the gradient continuous across every shape,
         so the overlapping head / neck / torso pieces read as one figure -->
    <linearGradient id="fig" gradientUnits="userSpaceOnUse" x1="190" y1="80" x2="430" y2="800">
      <stop offset="0" stop-color="#F1F1F1"/>
      <stop offset=".42" stop-color="#CBCBCE"/>
      <stop offset="1" stop-color="#828387"/>
    </linearGradient>
  </defs>

  <g fill="url(#fig)">
    <!-- head -->
    <ellipse cx="300" cy="198" rx="97" ry="110"/>
    <!-- neck -->
    <rect x="256" y="280" width="88" height="96" rx="28"/>
    <!-- shoulders + torso, cropped by the viewBox at the bottom edge -->
    <path d="M105 800V540c0-72 47-121 112-137 22-6 20-42 20-73v-30h86v30c0 31-2 67 20 73 65 16 112 65 112 137V800Z"/>
  </g>
</svg>