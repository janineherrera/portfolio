# TLS variant of default.conf — mount this over default.conf in a real
# deployment (see the `portfolio-tls` service in docker-compose.yml).
#
# The CSP `script-src` hash in snippets/security-headers.conf still applies:
# only enable HSTS once you are certain everything is served over https,
# otherwise browsers will refuse to return to http:// for the whole origin.

server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/xml
        font/woff
        font/woff2;

    include /etc/nginx/snippets/security-headers.conf;

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /robots.txt =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /index.html;
}

# Redirect plain HTTP to HTTPS.
server {
    listen      80;
    listen      [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}