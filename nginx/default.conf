# nginx config for the static portfolio.
# Installed at /etc/nginx/conf.d/default.conf in the nginx image.
# Snippets live at /etc/nginx/snippets/.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/xml
        font/woff
        font/woff2;

    include /etc/nginx/snippets/security-headers.conf;

    # ── Caching ──────────────────────────────────────────────────────────────
    # Every location below re-includes the security headers: nginx drops the
    # inherited `add_header` set as soon as a location declares one of its own.

    # HTML is never cached, so a redeploy is picked up immediately.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /robots.txt =404;
    }

    # Site assets can be cached hard — filenames are stable, so rename
    # (and re-cache-bust) a file if you ever change its contents in place.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page fallback for anything else.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never expose dotfiles.
    location ~ /\. {
        deny all;
    }

    error_page 404 /index.html;
}