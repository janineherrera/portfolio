# Security headers, kept in one place.
#
# nginx quirk: `add_header` directives are NOT inherited into a `location`
# block that defines its own `add_header`. Every location that sets a header
# must therefore `include` this file, or it silently loses these headers.

# `script-src` allows exactly one inline script by content hash — the
# `documentElement.classList.add('js')` guard in <head>. The JSON-LD block is a
# non-executable script type, so CSP does not apply to it.
#
# The hash is BASE64 of the sha256 digest (that is the form CSP specifies and the
# form browsers actually match — a hex digest is NOT accepted).
# Regenerate after editing that inline script:
#   node -e "const{sha256}=require('crypto');const s=process.argv[1];\
#     console.log('sha256-'+sha256(s).digest('base64'))" \
#     "document.documentElement.classList.add('js');"
#
# If the hash ever stops matching the failure is graceful: the `.js` class is
# never added, the reveal animations stop, and all content stays visible.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Uncomment once you are serving over HTTPS (pointless on plain http):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;